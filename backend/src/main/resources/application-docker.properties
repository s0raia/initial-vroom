# Activated by SPRING_PROFILES_ACTIVE: docker in docker-compose.yml.
# "db" hostname resolves to the Postgres container via Docker's internal DNS.
spring.config.activate.on-profile=docker

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/vroom}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:vroom}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:vroom}
