# Shared settings — active in every profile.
# Profile-specific config lives in application-{local,docker,prod}.properties.
spring.application.name=initial-vroom

# Using 8081 instead of the default 8080 to avoid conflicts with other local servers
server.port=8081

# Hibernate creates/updates the cars table on startup so we don't need a separate migration tool
spring.jpa.hibernate.ddl-auto=update
