# Three-service stack: PostgreSQL -> Spring Boot backend -> Angular frontend (nginx)
# Start everything: docker-compose up --build
# depends_on controls startup order, but doesn't wait for services to be "ready"

services:
  # PostgreSQL: stores the car specs table
  db:
    image: postgres:16-alpine
    container_name: db-postgres-initial
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: vroom
      POSTGRES_USER: vroom
      POSTGRES_PASSWORD: vroom

  # Spring Boot: REST API + WebSocket simulation engine
  backend:
    build: ./backend
    container_name: initial-vroom-back
    ports:
      - "8081:8081"
    environment:
      # Activates application-docker.properties
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/vroom
      SPRING_DATASOURCE_USERNAME: vroom
      SPRING_DATASOURCE_PASSWORD: vroom
    depends_on:
      - db

  # Angular app served by nginx (static files only — browser calls backend directly)
  frontend:
    build:
      context: ./frontend
      args:
        # Build with development config so environment.ts (localhost URLs) is used
        NG_CONFIG: development
    container_name: initial-vroom-front
    ports:
      - "4200:80"
    depends_on:
      - backend
